[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staticpypi"
version = "0.1.0"
description = "Maintain a PyPI-compatible static index over FTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bcrypt>=4.0",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.6"]

[dependency-groups]
dev = ["pytest>=8", "pyftpdlib>=2.0"]

[project.scripts]
staticpypi = "staticpypi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["staticpypi*"]
