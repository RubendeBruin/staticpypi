[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staticpypi"
version = "0.1.0"
description = "Maintain a PyPI-compatible static index over FTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyside6-essentials>=6.6",
]

[project.scripts]
staticpypi = "staticpypi.main:main"
staticpypi-cli = "staticpypi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["staticpypi*"]
